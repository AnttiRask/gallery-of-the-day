name: Backfill Missing Days

# Manual only. Fills in the prompt and image for the days it is given: either every
# date from start_date to end_date (inclusive), or the list in `dates`. Days that are
# already complete are skipped. With `regenerate` every given day is made again from
# scratch (a new event and a new image) and the old one is overwritten: archive the
# old images and captions first. Each image costs about US$0.06.
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'First date to backfill (YYYY-MM-DD). Not needed when "dates" is given'
        required: false
      end_date:
        description: 'Last date to backfill (YYYY-MM-DD). Not needed when "dates" is given'
        required: false
      dates:
        description: 'Instead of a range: dates separated by spaces or commas (YYYY-MM-DD)'
        required: false
      regenerate:
        description: 'Make the days again even if they exist (overwrites them)'
        type: boolean
        default: false

# Never run next to the daily job or another backfill (both write to the same database and bucket)
concurrency:
  group: gallery-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    permissions:
      contents: read

    steps:
    - name: List the dates
      env:
        START_DATE: ${{ inputs.start_date }}
        END_DATE: ${{ inputs.end_date }}
        DATES: ${{ inputs.dates }}
      run: |
        valid() { [[ "$1" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && date -d "$1" >/dev/null 2>&1; }
        : > dates.txt
        if [[ -n "${DATES// /}" ]]; then
          for d in ${DATES//,/ }; do
            valid "$d" || { echo "::error::Not a valid date: $d"; exit 1; }
            echo "$d" >> dates.txt
          done
        else
          valid "$START_DATE" && valid "$END_DATE" || { echo "::error::Give a valid start_date and end_date, or a list of dates"; exit 1; }
          [[ ! "$START_DATE" > "$END_DATE" ]] || { echo "::error::start_date is after end_date"; exit 1; }
          d="$START_DATE"
          while [[ ! "$d" > "$END_DATE" ]]; do
            echo "$d" >> dates.txt
            d=$(date -d "$d + 1 day" +%F)
          done
        fi
        today=$(date -u +%F)
        while read -r d; do
          [[ ! "$d" > "$today" ]] || { echo "::error::$d is in the future"; exit 1; }
        done < dates.txt
        echo "$(wc -l < dates.txt) day(s) to do, from $(head -1 dates.txt) to $(tail -1 dates.txt)"

    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up R environment
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.5'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

    - name: Set up renv
      uses: r-lib/actions/setup-renv@v2

    - name: Backfill the dates
      env:
        REGENERATE: ${{ inputs.regenerate }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
        TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      run: |
        flag=""
        [[ "$REGENERATE" == "true" ]] && flag="--regenerate"
        failed=()
        done_count=0
        while read -r d; do
          echo "::group::$d $flag"
          if Rscript R/backfill_date.R "$d" $flag; then
            done_count=$((done_count + 1))
          else
            failed+=("$d")
          fi
          echo "::endgroup::"
        done < dates.txt
        echo "Backfilled (or already complete): $done_count day(s)"
        if (( ${#failed[@]} > 0 )); then
          echo "::error::Failed dates: ${failed[*]}"
          exit 1
        fi
