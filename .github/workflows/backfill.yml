name: Backfill Missing Days

# Manual only. Fills in the prompt and image for every date from start_date to
# end_date (inclusive) with R/backfill_date.R, which skips work that already exists.
# Each image costs about US$0.15, so run a single day first.
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'First date to backfill (YYYY-MM-DD)'
        required: true
      end_date:
        description: 'Last date to backfill (YYYY-MM-DD)'
        required: true

# Never run next to the daily job or another backfill (both write to the same database and bucket)
concurrency:
  group: gallery-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    permissions:
      contents: read

    steps:
    - name: Check the dates
      env:
        START_DATE: ${{ inputs.start_date }}
        END_DATE: ${{ inputs.end_date }}
      run: |
        for d in "$START_DATE" "$END_DATE"; do
          [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && date -d "$d" >/dev/null || { echo "::error::Not a valid date: $d"; exit 1; }
        done
        [[ ! "$START_DATE" > "$END_DATE" ]] || { echo "::error::start_date is after end_date"; exit 1; }
        [[ ! "$END_DATE" > "$(date -u +%F)" ]] || { echo "::error::end_date is in the future"; exit 1; }

    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up R environment
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.5'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

    - name: Set up renv
      uses: r-lib/actions/setup-renv@v2

    - name: Backfill the dates
      env:
        START_DATE: ${{ inputs.start_date }}
        END_DATE: ${{ inputs.end_date }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
        TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      run: |
        failed=()
        done_count=0
        d="$START_DATE"
        while [[ ! "$d" > "$END_DATE" ]]; do
          echo "::group::$d"
          if Rscript R/backfill_date.R "$d"; then
            done_count=$((done_count + 1))
          else
            failed+=("$d")
          fi
          echo "::endgroup::"
          d=$(date -d "$d + 1 day" +%F)
        done
        echo "Backfilled (or already complete): $done_count day(s)"
        if (( ${#failed[@]} > 0 )); then
          echo "::error::Failed dates: ${failed[*]}"
          exit 1
        fi
