# Local run of the production image:  docker compose up --build
# then open http://localhost:8083
services:
  shiny-app:
    build: .
    ports:
      - "8083:8080"
    # The Turso settings come from the git-ignored .env; they are not copied into the image
    environment:
      - PORT=8080
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN}
    volumes:
      # Live code changes without rebuilding (restart the container to reload)
      - ./app:/app/app
    restart: unless-stopped
